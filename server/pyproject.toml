[project]
name = "trading-ai-platform-server"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 132
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "B008",   # FastAPI Depends()/Query() in argument defaults is the framework idiom
  "S101",   # assert in tests
  "S311",   # random for simulations, not crypto
  "S301",   # joblib/pickle load is guarded by registry checksum verification
  "SIM108",
  "UP042",  # (str, Enum) kept deliberately for JSON-friendly values
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "_common"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
